name: Create Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'release:')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep "^v" | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo $LATEST_TAG | cut -d. -f2)
            PATCH=$(echo $LATEST_TAG | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Extract release subtitle
        id: title
        run: |
          SUBTITLE=$(echo "${{ github.event.head_commit.message }}" | sed 's/^release: //' | head -1)
          echo "subtitle=$SUBTITLE" >> $GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          SUBTITLE="${{ steps.title.outputs.subtitle }}"

          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" | grep -v "^- release:" | head -20)
          else
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" | grep -v "^- release:")
          fi

          cat > release_notes.md <<EOF
          ## Militopia ${NEW_TAG} — ${SUBTITLE}

          ### What's changed
          ${COMMITS}

          ### Downloads

          | File | Platform | Requirements |
          |------|----------|--------------|
          | \`Militopia-${NEW_TAG}-windows.zip\` | Windows 64-bit | None — Java bundled |
          | \`Militopia-${NEW_TAG}-mac-arm64.zip\` | macOS Apple Silicon (M1/M2/M3) | None — Java bundled |
          | \`Militopia-${NEW_TAG}-universal.jar\` | Windows / macOS / Linux | Java 8+ required |

          ### How to run

          **Windows** — Extract zip → open \`roast\` folder → double-click \`Militopia.exe\`

          **macOS** — Extract zip → right-click \`Militopia.app\` → Open

          **JAR** — \`java -jar Militopia-${NEW_TAG}-universal.jar\`
          EOF

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          SUBTITLE="${{ steps.title.outputs.subtitle }}"
          gh release create "$NEW_TAG" \
            --title "Militopia ${NEW_TAG} — ${SUBTITLE}" \
            --notes-file release_notes.md
